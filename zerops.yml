zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web
        - npm ci
        - npm run build
      deployFiles:
        - apps/web/.next/standalone
        - apps/web/.next/static
        - apps/web/public
      cache:
        - apps/web/node_modules

    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/nexus?sslmode=require
        GROQ_API_KEY: ${GROQ_API_KEY}
      start: node apps/web/.next/standalone/server.js
